name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # ubuntu-latest (26.04) ships no 3.9 build; keep 3.9 on ubuntu-22.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Test against bundled fake router
        env:
          PYTHONPATH: src
        run: |
          # Live ipTIME 16.x router hardware and credentials are left out of CI;
          # regression tests run against the bundled fake router only.
          python -m unittest discover -s tests
